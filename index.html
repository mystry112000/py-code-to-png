<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code to PNG Generator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #0a0a0f;
  color: #e0e0e0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 2rem;
  overflow-x: hidden;
  perspective: 1200px;
}

/* Animated grid background */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(88, 166, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(88, 166, 255, 0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  z-index: 0;
  pointer-events: none;
}

/* Floating orb effect */
body::after {
  content: '';
  position: fixed;
  top: -30%;
  left: -10%;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(88, 166, 255, 0.08) 0%, transparent 70%);
  border-radius: 50%;
  z-index: 0;
  pointer-events: none;
  animation: orbFloat 20s ease-in-out infinite;
}

@keyframes orbFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(100px, 80px) scale(1.1); }
  50% { transform: translate(50px, 160px) scale(0.9); }
  75% { transform: translate(-50px, 80px) scale(1.05); }
}

.container {
  max-width: 1100px;
  width: 100%;
  position: relative;
  z-index: 1;
  transform-style: preserve-3d;
}

/* Header with 3D glow */
.header {
  text-align: center;
  margin-bottom: 2.5rem;
  transform: translateZ(40px);
  position: relative;
}

.header h1 {
  font-size: 2.2rem;
  font-weight: 800;
  background: linear-gradient(135deg, #58a6ff, #a371f7, #58a6ff);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: gradientShift 4s ease-in-out infinite;
  letter-spacing: -0.5px;
  margin-bottom: 0.3rem;
}

@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.header p {
  color: #8b949e;
  font-size: 0.95rem;
  letter-spacing: 0.3px;
}

/* 3D Card styles */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
  transform-style: preserve-3d;
}

@media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

.card {
  background: linear-gradient(145deg, rgba(22, 27, 34, 0.9), rgba(13, 17, 23, 0.95));
  border: 1px solid rgba(48, 54, 61, 0.5);
  border-radius: 16px;
  padding: 1.25rem;
  backdrop-filter: blur(20px);
  transform: translateZ(20px) rotateX(2deg);
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  border-radius: 16px;
  padding: 1px;
  background: linear-gradient(135deg, rgba(88, 166, 255, 0.2), transparent 50%, rgba(163, 113, 247, 0.2));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.4s;
}

.card:hover {
  transform: translateZ(40px) rotateX(0deg) scale(1.02);
  border-color: rgba(88, 166, 255, 0.3);
  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.5),
    0 0 40px rgba(88, 166, 255, 0.05);
}

.card:hover::before { opacity: 1; }

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.75rem;
}

.card-header h2 {
  font-size: 0.8rem;
  color: #8b949e;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 600;
}

.card-header .badge {
  font-size: 0.65rem;
  padding: 2px 8px;
  border-radius: 20px;
  background: rgba(88, 166, 255, 0.1);
  color: #58a6ff;
  border: 1px solid rgba(88, 166, 255, 0.2);
}

/* Code textarea */
textarea {
  width: 100%;
  height: 350px;
  background: rgba(13, 17, 23, 0.8);
  color: #e0e0e0;
  border: 1px solid rgba(48, 54, 61, 0.4);
  border-radius: 10px;
  padding: 1rem;
  font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  font-size: 13px;
  resize: vertical;
  tab-size: 4;
  line-height: 1.6;
  transition: all 0.3s;
  backdrop-filter: blur(10px);
}

textarea:focus {
  outline: none;
  border-color: rgba(88, 166, 255, 0.5);
  box-shadow: 0 0 30px rgba(88, 166, 255, 0.05), inset 0 0 30px rgba(88, 166, 255, 0.02);
}

/* Upload area */
.upload-area {
  height: 350px;
  border: 2px dashed rgba(48, 54, 61, 0.5);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.4s;
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(5px);
}

.upload-area::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(88, 166, 255, 0.03), transparent);
  opacity: 0;
  transition: opacity 0.4s;
}

.upload-area:hover {
  border-color: rgba(88, 166, 255, 0.4);
  transform: scale(1.01);
}

.upload-area:hover::before { opacity: 1; }

.upload-area.has-image { border-style: solid; }

.upload-area .placeholder {
  text-align: center;
  color: #8b949e;
  z-index: 1;
  transform: translateZ(10px);
}

.upload-area .placeholder .icon-wrap {
  width: 64px;
  height: 64px;
  margin: 0 auto 0.75rem;
  background: rgba(88, 166, 255, 0.05);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(88, 166, 255, 0.1);
  transition: all 0.4s;
}

.upload-area:hover .placeholder .icon-wrap {
  background: rgba(88, 166, 255, 0.1);
  transform: scale(1.1) translateZ(20px);
  box-shadow: 0 0 30px rgba(88, 166, 255, 0.1);
}

.upload-area .placeholder .icon-wrap svg { width: 28px; height: 28px; opacity: 0.6; }

.upload-area .placeholder p { font-size: 0.85rem; }
.upload-area .placeholder small { font-size: 0.75rem; opacity: 0.6; }

.upload-area .remove-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(218, 54, 51, 0.8);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 0.75rem;
  cursor: pointer;
  display: none;
  z-index: 2;
  backdrop-filter: blur(10px);
  transition: all 0.3s;
}

.upload-area .remove-btn:hover {
  background: rgba(218, 54, 51, 1);
  transform: scale(1.05);
}

.upload-area.has-image .remove-btn { display: block; }
.upload-area input[type="file"] { display: none; }

/* Options bar */
.options-bar {
  display: flex;
  gap: 1rem;
  margin-top: 1.25rem;
  flex-wrap: wrap;
  align-items: center;
  transform: translateZ(15px);
}

.option-group {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: rgba(22, 27, 34, 0.6);
  border: 1px solid rgba(48, 54, 61, 0.3);
  border-radius: 10px;
  padding: 0.5rem 0.9rem;
  backdrop-filter: blur(10px);
  transition: all 0.3s;
}

.option-group:hover {
  border-color: rgba(88, 166, 255, 0.2);
  background: rgba(22, 27, 34, 0.8);
}

.option-group label {
  font-size: 0.75rem;
  color: #8b949e;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}

.option-group select,
.option-group input[type="number"] {
  background: rgba(13, 17, 23, 0.6);
  color: #e0e0e0;
  border: 1px solid rgba(48, 54, 61, 0.3);
  border-radius: 6px;
  padding: 0.3rem 0.6rem;
  font-size: 0.8rem;
  transition: all 0.3s;
}

.option-group select:focus,
.option-group input[type="number"]:focus {
  outline: none;
  border-color: rgba(88, 166, 255, 0.4);
}

.option-group input[type="range"] {
  accent-color: #58a6ff;
  width: 90px;
}

.option-group .range-value {
  font-size: 0.8rem;
  color: #58a6ff;
  font-weight: 600;
  min-width: 32px;
  text-align: center;
}

/* Preview section */
.preview-section { margin-top: 1.75rem; transform: translateZ(25px); }

.preview-section .card { padding: 1.5rem; }

.preview-section .card-header { margin-bottom: 1rem; }

#previewContainer {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  min-height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(13, 17, 23, 0.6);
  border: 1px solid rgba(48, 54, 61, 0.3);
  transition: all 0.3s;
}

#previewContainer.has-bg {
  background-size: cover;
  background-position: center;
}

#previewCode {
  padding: 1.5rem;
  font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  font-size: 13px;
  line-height: 1.6;
  white-space: pre;
  overflow: auto;
  max-height: 500px;
  width: 100%;
}

#previewCode code.hljs { background: transparent !important; padding: 0 !important; }

/* Buttons */
.actions {
  display: flex;
  gap: 0.75rem;
  margin-top: 1.25rem;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.7rem 1.8rem;
  border: none;
  border-radius: 10px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  position: relative;
  overflow: hidden;
  letter-spacing: 0.3px;
}

.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
  opacity: 0;
  transition: opacity 0.4s;
}

.btn:hover::after { opacity: 1; }

.btn-primary {
  background: linear-gradient(135deg, #238636, #2ea043);
  color: #fff;
  box-shadow: 0 4px 20px rgba(35, 134, 54, 0.3);
}

.btn-primary:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 8px 30px rgba(35, 134, 54, 0.4);
}

.btn-primary:active { transform: translateY(0) scale(0.98); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.btn-secondary {
  background: rgba(33, 38, 45, 0.8);
  color: #c9d1d9;
  border: 1px solid rgba(48, 54, 61, 0.4);
  backdrop-filter: blur(10px);
}

.btn-secondary:hover {
  background: rgba(48, 54, 61, 0.8);
  transform: translateY(-2px);
  border-color: rgba(88, 166, 255, 0.3);
}

/* Preview image */
#previewImg {
  max-width: 100%;
  border-radius: 10px;
  display: none;
  margin-top: 1rem;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  transform: translateZ(10px);
  transition: all 0.4s;
}

#previewImg:hover {
  transform: translateZ(20px) scale(1.01);
}

/* Status */
.status {
  font-size: 0.85rem;
  margin-top: 0.75rem;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  display: inline-block;
}

.status.error {
  color: #f85149;
  background: rgba(248, 81, 73, 0.1);
  border: 1px solid rgba(248, 81, 73, 0.2);
}

.status.success {
  color: #3fb950;
  background: rgba(63, 185, 80, 0.1);
  border: 1px solid rgba(63, 185, 80, 0.2);
}

/* Glow line under header */
.glow-line {
  width: 80px;
  height: 3px;
  margin: 0.5rem auto 0;
  background: linear-gradient(90deg, transparent, #58a6ff, #a371f7, transparent);
  border-radius: 2px;
  animation: glowLinePulse 3s ease-in-out infinite;
}

@keyframes glowLinePulse {
  0%, 100% { opacity: 0.5; width: 80px; }
  50% { opacity: 1; width: 120px; }
}

/* Floating particles */
.particles {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.particle {
  position: absolute;
  width: 2px;
  height: 2px;
  background: rgba(88, 166, 255, 0.3);
  border-radius: 50%;
  animation: particleFloat linear infinite;
}

@keyframes particleFloat {
  0% { transform: translateY(100vh) translateX(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-10vh) translateX(100px); opacity: 0; }
}

/* Scrollbar styling */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(48, 54, 61, 0.5); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(88, 166, 255, 0.3); }
</style>
</head>
<body>

<!-- Particles background -->
<div class="particles" id="particles"></div>

<div class="container">
  <!-- Header with 3D effect -->
  <div class="header">
    <h1>Code → PNG</h1>
    <div class="glow-line"></div>
    <p>Transform your Python code into beautiful PNG images</p>
  </div>

  <!-- Main Grid -->
  <div class="grid">
    <div class="card">
      <div class="card-header">
        <h2>Python Code</h2>
        <span class="badge">.py</span>
      </div>
      <textarea id="codeInput" placeholder="Paste your Python code here..." spellcheck="false">print("Hello, World!")</textarea>
    </div>
    <div class="card">
      <div class="card-header">
        <h2>Background Image</h2>
        <span class="badge">PNG / JPEG</span>
      </div>
      <div class="upload-area" id="uploadArea">
        <div class="placeholder">
          <div class="icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="m21 15-5-5L5 21"/>
            </svg>
          </div>
          <p>Drop an image here or click to browse</p>
          <small>Serves as background for your code</small>
        </div>
        <input type="file" id="imageInput" accept="image/png,image/jpeg,image/jpg">
        <button class="remove-btn" id="removeBtn">✕ Remove</button>
      </div>
    </div>
  </div>

  <!-- Options -->
  <div class="options-bar">
    <div class="option-group">
      <label>Style</label>
      <select id="styleSelect">
        <option value="atom-one-dark">Atom One Dark</option>
        <option value="github-dark">GitHub Dark</option>
        <option value="monokai-sublime">Monokai</option>
        <option value="vs2015">VS Code</option>
        <option value="dracula">Dracula</option>
        <option value="nord">Nord</option>
      </select>
    </div>
    <div class="option-group">
      <label>Font</label>
      <input type="number" id="fontSize" value="14" min="10" max="24">
    </div>
    <div class="option-group">
      <label>Opacity</label>
      <input type="range" id="bgOpacity" min="0.1" max="1" step="0.05" value="0.6">
      <span class="range-value" id="opacityLabel">0.60</span>
    </div>
  </div>

  <!-- Preview -->
  <div class="preview-section">
    <div class="card">
      <div class="card-header">
        <h2>Preview</h2>
      </div>
      <div id="previewContainer">
        <div id="previewCode"><code class="hljs language-python"></code></div>
      </div>
      <img id="previewImg" alt="Preview">
      <div class="actions">
        <button class="btn btn-primary" id="generateBtn">⬇ Generate &amp; Download ZIP</button>
        <button class="btn btn-secondary" id="previewBtn">⟳ Refresh Preview</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>

  <link id="hljsTheme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</div>

<script>
// Generate floating particles
const particlesContainer = document.getElementById('particles');
for (let i = 0; i < 30; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
  p.style.animationDuration = (15 + Math.random() * 25) + 's';
  p.style.animationDelay = (Math.random() * 10) + 's';
  p.style.opacity = 0.2 + Math.random() * 0.4;
  particlesContainer.appendChild(p);
}

// 3D tilt effect on cards
document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('mousemove', (e) => {
    const rect = card.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    card.style.transform = `translateZ(30px) rotateX(${-y * 4}deg) rotateY(${x * 4}deg)`;
  });
  card.addEventListener('mouseleave', () => {
    card.style.transform = 'translateZ(20px) rotateX(2deg)';
  });
});

const codeInput = document.getElementById('codeInput');
const previewCode = document.getElementById('previewCode').querySelector('code');
const previewContainer = document.getElementById('previewContainer');
const previewImg = document.getElementById('previewImg');
const imageInput = document.getElementById('imageInput');
const uploadArea = document.getElementById('uploadArea');
const removeBtn = document.getElementById('removeBtn');
const generateBtn = document.getElementById('generateBtn');
const previewBtn = document.getElementById('previewBtn');
const styleSelect = document.getElementById('styleSelect');
const fontSize = document.getElementById('fontSize');
const bgOpacity = document.getElementById('bgOpacity');
const opacityLabel = document.getElementById('opacityLabel');
const status = document.getElementById('status');
const hljsTheme = document.getElementById('hljsTheme');

let uploadedImageData = null;

bgOpacity.addEventListener('input', () => {
  opacityLabel.textContent = parseFloat(bgOpacity.value).toFixed(2);
});

uploadArea.addEventListener('click', (e) => {
  if (e.target === removeBtn) return;
  imageInput.click();
});

imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    uploadedImageData = e.target.result;
    uploadArea.classList.add('has-image');
    uploadArea.style.backgroundImage = `url(${uploadedImageData})`;
    uploadArea.querySelector('.placeholder').style.display = 'none';
  };
  reader.readAsDataURL(file);
});

removeBtn.addEventListener('click', () => {
  uploadedImageData = null;
  imageInput.value = '';
  uploadArea.classList.remove('has-image');
  uploadArea.style.backgroundImage = '';
  uploadArea.querySelector('.placeholder').style.display = '';
});

styleSelect.addEventListener('change', () => {
  const val = styleSelect.value;
  hljsTheme.href = `https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/${val}.min.css`;
  updatePreview();
});

fontSize.addEventListener('input', updatePreview);
codeInput.addEventListener('input', updatePreview);
previewBtn.addEventListener('click', updatePreview);

function updatePreview() {
  const code = codeInput.value || ' ';
  previewCode.textContent = code;
  hljs.highlightElement(previewCode);
  const size = parseInt(fontSize.value) || 14;
  previewCode.style.fontSize = `${size}px`;
  if (uploadedImageData) {
    previewContainer.style.backgroundImage = `url(${uploadedImageData})`;
    previewContainer.classList.add('has-bg');
    previewContainer.style.opacity = bgOpacity.value;
  } else {
    previewContainer.style.backgroundImage = '';
    previewContainer.classList.remove('has-bg');
    previewContainer.style.opacity = '1';
  }
  previewImg.style.display = 'none';
}

async function renderToCanvas() {
  const code = codeInput.value || ' ';
  const size = parseInt(fontSize.value) || 14;
  const padding = 40;
  const lines = code.split('\n');
  const maxLineLen = Math.max(...lines.map(l => l.length), 1);
  const charW = size * 0.6;
  const lineH = size * 1.5;
  const fitW = maxLineLen * charW + padding * 2;
  const fitH = lines.length * lineH + padding * 2;

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  let bgImg = null;
  if (uploadedImageData) {
    bgImg = await new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.src = uploadedImageData;
    });
  }

  if (bgImg) {
    canvas.width = Math.max(bgImg.width, fitW);
    canvas.height = Math.max(bgImg.height, fitH);
  } else {
    canvas.width = fitW;
    canvas.height = fitH;
  }

  if (bgImg) {
    ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
    ctx.fillStyle = `rgba(0, 0, 0, ${1 - bgOpacity.value})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  const textX = Math.max((canvas.width - fitW) / 2, padding);
  let textY = Math.max((canvas.height - lines.length * lineH) / 2, padding);

  const colorMap = {
    'hljs-keyword': '#c678dd',
    'hljs-built_in': '#e6c07b',
    'hljs-type': '#e6c07b',
    'hljs-literal': '#56b6c2',
    'hljs-number': '#d19a66',
    'hljs-operator': '#56b6c2',
    'hljs-punctuation': '#abb2bf',
    'hljs-property': '#e06c75',
    'hljs-regexp': '#98c379',
    'hljs-string': '#98c379',
    'hljs-char-escape': '#d19a66',
    'hljs-subst': '#abb2bf',
    'hljs-symbol': '#61afef',
    'hljs-variable': '#e06c75',
    'hljs-variable-language': '#e06c75',
    'hljs-params': '#abb2bf',
    'hljs-comment': '#5c6370',
    'hljs-doctag': '#5c6370',
    'hljs-meta': '#5c6370',
    'hljs-tag': '#e06c75',
    'hljs-attribute': '#d19a66',
    'hljs-attr': '#e06c75',
    'hljs-selector-tag': '#c678dd',
    'hljs-selector-id': '#61afef',
    'hljs-selector-class': '#e6c07b',
    'hljs-template-variable': '#e06c75',
    'hljs-addition': '#98c379',
    'hljs-deletion': '#e06c75',
  };

  ctx.font = `${size}px 'Courier New', monospace`;
  ctx.textBaseline = 'top';

  function renderNode(node, x) {
    if (node.nodeType === Node.TEXT_NODE) {
      ctx.fillText(node.textContent, x, textY);
      return ctx.measureText(node.textContent).width;
    }
    if (node.nodeType === Node.ELEMENT_NODE) {
      let color = '#abb2bf';
      for (const cls of node.classList) {
        if (colorMap[cls]) { color = colorMap[cls]; break; }
      }
      ctx.fillStyle = color;
      let dx = 0;
      for (const child of node.childNodes) {
        dx += renderNode(child, x + dx);
      }
      return dx;
    }
    return 0;
  }

  const parser = new DOMParser();

  for (const rawLine of lines) {
    const lineDiv = document.createElement('code');
    lineDiv.className = 'hljs language-python';
    lineDiv.textContent = rawLine || ' ';
    hljs.highlightElement(lineDiv);
    const lineHTML = lineDiv.innerHTML;
    if (!lineHTML) continue;
    const lineDoc = parser.parseFromString(`<root>${lineHTML}</root>`, 'text/html');
    const lineRoot = lineDoc.body.firstElementChild;
    if (lineRoot) {
      let dx = 0;
      for (const child of lineRoot.childNodes) {
        dx += renderNode(child, textX + dx);
      }
    }
    textY += lineH;
  }

  return canvas;
}

generateBtn.addEventListener('click', async () => {
  if (!codeInput.value.trim()) {
    status.textContent = 'Please enter some code.';
    status.className = 'status error';
    return;
  }
  status.textContent = 'Generating...';
  status.className = 'status';
  generateBtn.disabled = true;
  try {
    const canvas = await renderToCanvas();
    const pngBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    const zip = new JSZip();
    zip.file('code.png', pngBlob);
    zip.file('code.py', codeInput.value);
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    saveAs(zipBlob, 'code-export.zip');
    previewImg.src = canvas.toDataURL('image/png');
    previewImg.style.display = 'block';
    status.textContent = 'Done! ZIP downloaded successfully.';
    status.className = 'status success';
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    status.className = 'status error';
  } finally {
    generateBtn.disabled = false;
  }
});

updatePreview();
</script>
